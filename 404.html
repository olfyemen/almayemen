<title>جارٍ التحويل</title>
<script>
// الروابط القديمة قبل ترتيب الأدوات في مجلدات: نحوّلها للمكان الجديد
(function(){
  var base = '/almayemen/';
  var p = location.pathname, rest = p.indexOf(base) === 0 ? p.slice(base.length) : '';
  var map = {
    'pdf.html': 'alma/pdf.html',
    'sahifa.html': 'sahifa/',
    'invoices.html': 'invoices/',
    'manifest.webmanifest': 'alma/manifest.webmanifest'
  };
  var to = map[rest];
  if (to) location.replace(base + to + location.search + location.hash);
})();
</script>

body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;background:#f4f6fb;color:#1e2240;
