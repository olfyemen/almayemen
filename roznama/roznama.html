<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe1">
<meta name="description" content="روزنامة هجرية يومية: حكمة، حديث، قصة من تراث العالم، مناسبات إسلامية، كلمات إنجليزية وتحضير للآيلتس">
<title>الروزنامة الهجرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe1; --paper:#fffaf0; --paper2:#fbf3e2; --ink:#2b2216; --muted:#7c6c55;
  --line:#e8dcc4; --green:#1f5e4a; --green2:#2e7d64; --gold:#b8862b; --gold-soft:#f3e3bf;
  --red:#9c2f2f; --red-soft:#f7e1dc; --blue:#2b5c8a; --blue-soft:#e2ecf6;
  --shadow:0 10px 30px rgba(80,55,20,.10), 0 2px 6px rgba(80,55,20,.06);
  --serif:"Amiri","Traditional Arabic","Times New Roman",serif;
  --sans:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --latin:"Georgia","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130e; --paper:#221d16; --paper2:#2a241b; --ink:#f1e7d3; --muted:#b4a387;
    --line:#3d3426; --green:#5cbf9c; --green2:#7fd3b4; --gold:#e0b25a; --gold-soft:#3b301b;
    --red:#e58a7d; --red-soft:#3b2220; --blue:#8bb9e6; --blue-soft:#1d2a38;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#16130e; --paper:#221d16; --paper2:#2a241b; --ink:#f1e7d3; --muted:#b4a387;
  --line:#3d3426; --green:#5cbf9c; --green2:#7fd3b4; --gold:#e0b25a; --gold-soft:#3b301b;
  --red:#e58a7d; --red-soft:#3b2220; --blue:#8bb9e6; --blue-soft:#1d2a38;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.85;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}

/* ===== Top bar ===== */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--green);white-space:nowrap}
.brand small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.seg{margin-inline-start:auto;display:flex;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:5px 13px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted);transition:.2s}
.seg button.on{background:var(--green);color:#fff}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper2);flex:none}
.icon-btn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== Day page ===== */
.stage{position:relative;margin-top:18px}
.page{animation:none}
.page.in-next{animation:inNext .32s ease}
.page.in-prev{animation:inPrev .32s ease}
@keyframes inNext{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}

.sheet{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;position:relative;border:1px solid var(--line)}
.rings{display:flex;justify-content:space-around;padding:0 18%;height:0;position:relative;top:-7px}
.rings i{width:14px;height:22px;border-radius:8px;background:var(--bg);border:2px solid var(--line);display:block;position:relative;top:0}
.head{background:linear-gradient(160deg,var(--green),var(--green2));color:#fff;padding:22px 20px 18px;text-align:center;position:relative}
:root[data-theme="dark"] .head{color:#10140f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .head{color:#10140f}}
.head .wd{font-size:20px;font-weight:800;letter-spacing:.5px;opacity:.95}
.head .big{font-family:var(--serif);font-size:110px;line-height:1;font-weight:700;margin:6px 0 2px;text-shadow:0 3px 0 rgba(0,0,0,.08)}
.head .hm{font-family:var(--serif);font-size:28px;font-weight:700}
.head .gd{margin-top:6px;font-size:16px;opacity:.92;display:inline-block;padding:3px 14px;border-radius:999px;background:rgba(255,255,255,.16)}
.head .badge-today{position:absolute;top:14px;inset-inline-start:14px;font-size:12px;font-weight:800;background:var(--gold);color:#fff;border-radius:999px;padding:2px 10px}
.prog{padding:12px 20px 4px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
.prog .bar{flex:1;height:6px;background:var(--paper2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.prog .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green2));border-radius:999px}

.body{padding:10px 16px 18px;display:grid;gap:14px}
.occ{border-radius:16px;padding:12px 14px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.occ h4{font-size:14px;color:var(--gold);font-weight:800;margin-bottom:2px}
.occ p{font-size:16px}
.occ p+p{margin-top:6px}
.occ .t{font-weight:800}

.card{border-radius:16px;padding:14px 16px;background:var(--paper2);border:1px solid var(--line)}
.card .lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--green);margin-bottom:6px;letter-spacing:.3px}
.card .lbl .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.card .lbl .src{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px}
.wisdom{font-family:var(--serif);font-size:24px;line-height:1.7;text-align:center;padding:6px 4px}
.wisdom-o{text-align:center;font-size:13px;color:var(--muted)}
.hadith{font-family:var(--serif);font-size:21px;line-height:1.9}
.hadith-s{font-size:13px;color:var(--muted);margin-top:4px}
.story h3{font-family:var(--serif);font-size:22px;margin-bottom:4px}
.story .txt{font-size:16.5px}
.story .lesson{margin-top:8px;padding:8px 12px;border-inline-start:3px solid var(--gold);background:var(--paper);border-radius:8px;font-weight:500}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.motiv{font-size:18px;font-weight:700;text-align:center;color:var(--ink)}
.motiv::before{content:"✦ ";color:var(--gold)}
.motiv::after{content:" ✦";color:var(--gold)}

.c-hadith .lbl{color:var(--green)}
.c-story .lbl{color:var(--red)}
.c-en .lbl,.c-ielts .lbl{color:var(--blue)}
.c-wis .lbl{color:var(--gold)}

.en{direction:ltr;text-align:left}
.en-list{display:grid;gap:10px}
.en-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.en-item .w{font-family:var(--latin);font-size:21px;font-weight:700;color:var(--blue)}
.en-item .pos{font-size:12px;color:var(--muted);font-style:italic;margin-left:6px}
.en-item .ar{direction:rtl;text-align:right;font-size:15px;font-weight:700;float:right}
.en-item .ex{font-family:var(--latin);font-size:15.5px;color:var(--ink);opacity:.85;margin-top:2px;clear:both;line-height:1.5}
.say{border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:13px;color:var(--blue);margin-left:6px;vertical-align:middle}
.syn-words{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr;margin:4px 0 8px}
.syn-words span{font-family:var(--latin);font-weight:700;font-size:19px;background:var(--blue-soft);color:var(--blue);padding:3px 14px;border-radius:999px}
.syn-mean{text-align:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.syn-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.syn-row b{font-family:var(--latin);direction:ltr;color:var(--blue);font-size:17px;min-width:92px}
.syn-row .d{font-size:15.5px}
.syn-row .x{display:block;direction:ltr;text-align:left;font-family:var(--latin);font-size:14.5px;opacity:.8;line-height:1.5;margin-top:2px}
.tip{margin-top:8px;font-size:14px;background:var(--paper);border-radius:10px;padding:8px 12px;border:1px solid var(--line)}

.more-btn{width:100%;padding:13px;border-radius:14px;border:1.5px dashed var(--green);color:var(--green);font-weight:800;font-size:16px;background:transparent}
.more{display:none;gap:14px}
.more.open{display:grid;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.list-ev{list-style:none;display:grid;gap:6px}
.list-ev li{padding-inline-start:16px;position:relative;font-size:15.5px}
.list-ev li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.note{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;resize:vertical}
.saved{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--green)}

/* ===== Locked future ===== */
.lock{padding:46px 24px 40px;text-align:center}
.lock .ic{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);border:1px solid var(--line)}
.lock .ic svg{width:40px;height:40px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lock .q{font-family:var(--serif);font-size:27px;line-height:1.75;margin:8px 0 10px}
.lock .s{color:var(--muted);font-size:15px}
.lock .cd{display:inline-block;margin-top:16px;padding:6px 16px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);font-weight:700;font-size:15px}
.lock .back{margin-top:18px;display:inline-block;padding:10px 22px;border-radius:999px;background:var(--green);color:#fff;font-weight:800}

/* ===== Bottom nav ===== */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.nav .arrow{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:16px;background:var(--paper);border:1px solid var(--line);font-weight:800;font-size:16px;box-shadow:0 2px 8px rgba(80,55,20,.06)}
.nav .arrow:active{transform:scale(.97)}
.nav .arrow[disabled]{opacity:.4}
.nav .arrow svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav .today{height:50px;padding:0 18px;border-radius:16px;background:var(--green);color:#fff;font-weight:800;font-size:15px}
.nav .today[hidden]{display:none}
.nav .lbl-sm{font-size:12px;color:var(--muted);display:block;line-height:1.2;font-weight:500}
.nav .arrow .tx{text-align:center;line-height:1.3}

/* ===== Week / Month ===== */
.vhead{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 12px;text-align:center}
.vhead h2{font-family:var(--serif);font-size:26px;color:var(--green);line-height:1.3}
.vhead p{font-size:14px;color:var(--muted)}
.week{display:grid;gap:10px}
.wcell{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:start;width:100%;box-shadow:0 2px 8px rgba(80,55,20,.05)}
.wcell .n{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--green);text-align:center;line-height:1.1}
.wcell .n small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:700}
.wcell .info .a{font-weight:800;font-size:16px}
.wcell .info .b{font-size:13.5px;color:var(--muted)}
.wcell .info .c{font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.wcell .tag{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.wcell.today{border:2px solid var(--gold)}
.wcell.fut{opacity:.55;background:var(--paper2)}
.wcell.out{opacity:.35}

.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mgrid .dn{text-align:center;font-size:12.5px;font-weight:800;color:var(--muted);padding:4px 0}
.mc{aspect-ratio:1/1.12;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:2px;min-width:0}
.mc .h{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.1}
.mc .g{font-size:11px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;max-width:100%}
.mc.today{background:var(--green);border-color:var(--green);color:#fff}
.mc.today .g{color:#fff;opacity:.85}
.mc.fut{background:var(--paper2);opacity:.55}
.mc.fut .h::after{content:"";}
.mc .ev{position:absolute;top:5px;inset-inline-end:5px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.mc .lk{position:absolute;bottom:4px;width:10px;height:10px;opacity:.6}
.mc.empty{background:transparent;border:0}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block}
.mevents{margin-top:16px}

/* ===== Settings sheet ===== */
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,14,6,.45);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--paper);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-family:var(--serif);font-size:24px;color:var(--green);margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row .t{font-weight:700}
.row .t small{display:block;font-weight:400;color:var(--muted);font-size:13px;line-height:1.5}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button,.chip{min-width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--paper2);font-weight:800;padding:0 10px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.stepper output{min-width:34px;text-align:center;font-weight:800}
.close{margin-top:14px;width:100%;height:46px;border-radius:14px;background:var(--green);color:#fff;font-weight:800}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}

@media (min-width:700px){
  .head .big{font-size:130px}
  .body{padding:14px 26px 24px}
  .mc .h{font-size:27px}
  .mc .g{font-size:12px}
}
@media (max-width:380px){
  .brand small{display:none}
  .seg button{padding:5px 10px}
  .head .big{font-size:92px}
  .mc .h{font-size:19px}
  .mc .g{font-size:10px}
  .mgrid{gap:4px}
}
:root.fs-l body{font-size:19px}
:root.fs-l .wisdom{font-size:27px}
:root.fs-l .hadith{font-size:23px}
:root.fs-l .story .txt{font-size:18.5px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">الروزنامة <small id="yearLbl"></small></div>
    <div class="seg" role="tablist" aria-label="طريقة العرض">
      <button data-view="day" class="on">يومي</button>
      <button data-view="week">أسبوعي</button>
      <button data-view="month">شهري</button>
    </div>
    <button class="icon-btn" id="setBtn" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="stage" id="stage"></div>
  <p class="foot" id="foot"></p>
</main>

<nav class="nav">
  <div class="nav-in">
    <button class="arrow" id="prevBtn" aria-label="السابق">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      <span class="tx"><span id="prevTx">أمس</span><span class="lbl-sm" id="prevSub"></span></span>
    </button>
    <button class="today" id="todayBtn">اليوم</button>
    <button class="arrow" id="nextBtn" aria-label="التالي">
      <span class="tx"><span id="nextTx">غدًا</span><span class="lbl-sm" id="nextSub"></span></span>
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>
</nav>

<div class="modal" id="modal" aria-hidden="true">
  <div class="box" role="dialog" aria-label="الإعدادات">
    <h3>الإعدادات</h3>
    <div class="row">
      <div class="t">تعديل التاريخ الهجري<small>إذا اختلفت رؤية الهلال في بلدك عن تقويم أم القرى، قدّم أو أخّر يومًا.</small></div>
      <div class="stepper"><button id="adjMinus">−</button><output id="adjOut">0</output><button id="adjPlus">+</button></div>
    </div>
    <div class="row">
      <div class="t">المظهر</div>
      <div class="stepper"><button class="chip" data-theme-set="auto">تلقائي</button><button class="chip" data-theme-set="light">فاتح</button><button class="chip" data-theme-set="dark">داكن</button></div>
    </div>
    <div class="row">
      <div class="t">حجم الخط</div>
      <div class="stepper"><button class="chip" data-fs="n">عادي</button><button class="chip" data-fs="l">كبير</button></div>
    </div>
    <div class="row">
      <div class="t">التنقل<small>اسحب الصفحة يمينًا أو يسارًا، أو استخدم أسهم لوحة المفاتيح، أو الأزرار في الأسفل.</small></div>
    </div>
    <button class="close" id="closeSet">تم</button>
  </div>
</div>
<script>
/* ====================== المحتوى: حِكم من تراث العالم ====================== */

<script>
(function(){
"use strict";
/* ---------------- أدوات ---------------- */
const $ = s => document.querySelector(s);
const AR = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AR[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, def){ try{ const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const H_MONTHS = ["محرّم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوّال","ذو القعدة","ذو الحجة"];
const G_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const WDAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const WD_SAT = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];

const mkDate = (y,m,d) => new Date(y, m, d, 12, 0, 0);
const addDays = (dt, n) => mkDate(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
const key = dt => dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');

/* ---------------- التحويل إلى الهجري (أم القرى، مع بديل حسابي) ---------------- */
let intlFmt = null;
try{
  intlFmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', {day:'numeric', month:'numeric', year:'numeric'});
  const t = intlFmt.formatToParts(mkDate(2026,10,8));
  const y = +t.find(p => p.type === 'year').value;
  if (y !== 1448) intlFmt = null;
}catch(e){ intlFmt = null; }

function tabular(dt){
  const jd = Math.floor(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) / 86400000) + 2440588;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor(50 * l / 17719) + Math.floor(l / 5670) * Math.floor(43 * l / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor(17719 * j / 50) - Math.floor(j / 16) * Math.floor(15238 * j / 43) + 29;
  const m = Math.floor(24 * l / 709);
  const d = l - Math.floor(709 * m / 24);
  return {y: 30 * n + j - 30, m, d};
}
function hijriRaw(dt){
  if (intlFmt){
    const p = intlFmt.formatToParts(dt), g = t => +p.find(x => x.type === t).value;
    return {y: g('year'), m: g('month'), d: g('day')};
  }
  return tabular(dt);
}

/* ---------------- الإعدادات ---------------- */
const S = Object.assign({adj:0, theme:'auto', fs:'n', view:'day'}, store.get('rz-set', {}));
const saveS = () => store.set('rz-set', S);
function applyLook(){
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  r.classList.toggle('fs-l', S.fs === 'l');
  document.querySelectorAll('[data-theme-set]').forEach(b => b.classList.toggle('on', b.dataset.themeSet === S.theme));
  document.querySelectorAll('[data-fs]').forEach(b => b.classList.toggle('on', b.dataset.fs === S.fs));
  $('#adjOut').textContent = (S.adj > 0 ? '+' : '') + ar(S.adj);
}
const hijri = dt => hijriRaw(addDays(dt, S.adj));

/* ---------------- بناء أيام السنة الهجرية الحالية ---------------- */
let DAYS = [], TODAY = 0, YEAR = 0;
function build(){
  const now = new Date(), t = mkDate(now.getFullYear(), now.getMonth(), now.getDate());
  const th = hijri(t);
  YEAR = th.y;
  let start = addDays(t, -(th.d - 1));
  for (let k = 0; k < 13; k++){                 // الرجوع إلى ١ محرّم
    const h = hijri(start);
    if (h.m === 1 && h.d === 1 && h.y === YEAR) break;
    const prev = addDays(start, -1), ph = hijri(prev);
    start = addDays(prev, -(ph.d - 1));
  }
  DAYS = [];
  for (let dt = start, i = 0; i < 400; i++, dt = addDays(dt, 1)){
    const h = hijri(dt);
    if (h.y !== YEAR) break;
    DAYS.push({g: dt, y: h.y, m: h.m, d: h.d, i, k: key(dt)});
  }
  TODAY = DAYS.findIndex(x => x.k === key(t));
  if (TODAY < 0) TODAY = 0;
  $('#yearLbl').textContent = ar(YEAR) + 'هـ';
}

/* ---------------- اختيار المحتوى اليومي ---------------- */
const gcd = (a,b) => b ? gcd(b, a % b) : a;
function stepFor(n, seed){
  const c = [7,11,13,17,19,23,29,31,37];
  for (let s = 0; s < c.length; s++){ const k = c[(s + seed) % c.length]; if (gcd(k, n) === 1 && k < n) return k; }
  return 1;
}
const pick = (arr, i, seed, off) => arr[((i * stepFor(arr.length, seed)) + off) % arr.length];
function content(i){
  const N = WORDS.length, kw = stepFor(N, 3), off = YEAR % 7;
  return {
    wis: pick(WISDOM, i, 0, off), had: pick(HADITH, i, 1, off), sto: pick(STORIES, i, 2, off),
    mot: pick(MOTIV, i, 3, off), ch: pick(CHALLENGE, i, 4, off), rf: pick(REFLECT, i, 5, off),
    dh: pick(DHIKR, i, 6, off), ie: pick(IELTS, i, 7, off), wis2: pick(WISDOM, i + 31, 8, off),
    words: [0,1,2].map(j => WORDS[(((i * 3 + j) * kw) + off) % N])
  };
}

const OCC = {

 "1-1":"رأس السنة الميلادية.",
 "2-21":"اليوم الدولي للغة الأم.",
 "4-7":"يوم الصحة العالمي.",

 "10-14":"ذكرى ثورة ١٤ أكتوبر اليمنية.",
 "10-16":"يوم الأغذية العالمي.",

 "12-18":"اليوم العالمي للغة العربية."

function occasions(day){
  const mk = day.m + '-' + day.d, list = (OCC[mk] || []).slice(), sun = [];
  if (day.m === 9 && day.d >= 21) list.push(["من العشر الأواخر","أيام الاجتهاد والاعتكاف؛ كان ﷺ إذا دخلت العشر أحيا ليله وأيقظ أهله وشدّ مئزره."]);
  if (day.m === 9 && day.d >= 20 && day.d <= 28 && day.d % 2 === 0) list.push(["الليلة ليلة الـ" + ar(day.d + 1),"من ليالي الوتر التي تُرجى فيها ليلة القدر؛ أكثِر من قول: «اللهم إنك عفوٌّ تحب العفو فاعفُ عني»."]);
  if (day.m === 12 && day.d >= 2 && day.d <= 7) list.push(["من العشر الأوائل من ذي الحجة","أكثِر من التكبير والتهليل والتحميد والعمل الصالح."]);
  if ([13,14,15].includes(day.d) && !(day.m === 12 && day.d === 13) && day.m !== 9) sun.push("من الأيام البيض: يُسنّ صيام الثالث عشر والرابع عشر والخامس عشر من كل شهر.");
  const wd = day.g.getDay();
  if (wd === 5) sun.push("يوم الجمعة: قراءة سورة الكهف، والإكثار من الصلاة على النبي ﷺ، وتحرّي ساعة الإجابة.");
  if ((wd === 1 || wd === 4) && day.m !== 9 && !(day.m === 10 && day.d === 1) && !(day.m === 12 && day.d >= 10 && day.d <= 13)) sun.push("يُسنّ صيام يوم " + WDAYS[wd] + "؛ «تُعرض الأعمال يوم الاثنين والخميس» (رواه الترمذي).");
  const hist = HIST_DAY[mk] ? [HIST_DAY[mk]] : [];
  const gk = (day.g.getMonth() + 1) + '-' + day.g.getDate();
  if (G_DAYS[gk]) hist.push(G_DAYS[gk]);
  return {list, sun, hist};
}

    <div class="wd">${WDAYS[day.g.getDay()]}</div>
    <div class="big">${ar(day.d)}</div>
    <div class="hm">${H_MONTHS[day.m - 1]} ${ar(day.y)}هـ</div>
    <div class="gd">${fmtG(day.g)}</div>
  </div>`;
}

function lockHTML(i){
  const day = DAYS[i], w = LOCK_WISDOM[i % LOCK_WISDOM.length];
  const diff = i - TODAY;
  let when;
  if (diff === 1){
    const now = new Date(), mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const mins = Math.max(1, Math.round((mid - now) / 60000)), h = Math.floor(mins / 60), m = mins % 60;
    when = 'تُفتح هذه الصفحة بعد ' + (h ? ar(h) + ' ساعة' + (m ? ' و' : '') : '') + (m ? ar(m) + ' دقيقة' : '');
  } else when = 'تُفتح هذه الصفحة بعد ' + ar(diff) + ' يومًا';
  return `<article class="page ${dir}"><div class="sheet">${headHTML(day, false)}
    <div class="lock"><div class="ic">${LOCK_SVG}</div>
      <p class="s">لا تستعجل الغد…</p>
      <p class="q">${esc(w[0])}</p>
      <p class="s">— ${esc(w[1])}</p>
      <span class="cd">⏳ ${when}</span><br>
      <button class="back" id="backToday">عُد إلى يومك</button>
    </div></div></article>`;
}

/* ---------------- الرسم: الأسبوع ---------------- */
function weekStart(i){ const wd = (DAYS[i].g.getDay() + 1) % 7; return i - wd; }
function weekHTML(){
  const s = weekStart(cur);
  const first = DAYS[Math.max(0, s)], last = DAYS[Math.min(DAYS.length - 1, s + 6)];
  let cells = '';
  for (let k = 0; k < 7; k++){
    const i = s + k;
    if (i < 0 || i >= DAYS.length){ cells += `<div class="wcell out"><div class="n">—</div><div class="info"><div class="a">${WD_SAT[k]}</div><div class="b">خارج هذه السنة</div></div></div>`; continue; }
    const d = DAYS[i], o = occasions(d), fut = i > TODAY;
    const tag = o.list[0] ? `<span class="tag">${esc(o.list[0][0])}</span>` : (o.hist[0] ? '<span class="tag">📜</span>' : '');
    const snip = fut ? '🔒 لم يحن بعد — لا تستعجل' : esc(content(i).wis[0]);
    cells += `<button class="wcell ${i === TODAY ? 'today' : ''} ${fut ? 'fut' : ''}" data-go="${i}">
      <div class="n">${ar(d.d)}<small>${H_MONTHS[d.m - 1]}</small></div>
      <div class="info"><div class="a">${WDAYS[d.g.getDay()]}${i === TODAY ? ' — اليوم' : ''}</div><div class="b">${fmtG(d.g)}</div><div class="c">${snip}</div></div>${tag}</button>`;
  }
  return `<div class="page ${dir}"><div class="vhead"><div><h2>الأسبوع</h2><p>${fmtH(first)} — ${fmtH(last)}</p></div></div><div class="week">${cells}</div></div>`;
}

/* ---------------- الرسم: الشهر ---------------- */
function monthHTML(){
  const m = DAYS[cur].m, md = DAYS.filter(d => d.m === m);
  const lead = (md[0].g.getDay() + 1) % 7;
  let g = WD_SAT.map(x => `<div class="dn">${x.replace('ال','')}</div>`).join('');
  for (let k = 0; k < lead; k++) g += '<div class="mc empty"></div>';
  const evs = [];
  md.forEach(d => {
    const o = occasions(d), fut = d.i > TODAY, has = o.list.length || o.hist.length;
    if (has) evs.push(`<li><b>${ar(d.d)} ${H_MONTHS[d.m - 1]}</b> (${ar(d.g.getDate())} ${G_MONTHS[d.g.getMonth()]}): ${esc(o.list.map(x => x[0]).concat(o.hist).join(' · '))}</li>`);
    g += `<button class="mc ${d.i === TODAY ? 'today' : ''} ${fut ? 'fut' : ''}" data-go="${d.i}" aria-label="${fmtH(d)}">
      ${has ? '<span class="ev"></span>' : ''}<span class="h">${ar(d.d)}</span><span class="g">${ar(d.g.getDate())}${(d.g.getDate() === 1 || d.d === 1) ? ' ' + G_MONTHS[d.g.getMonth()] : ''}</span></button>`;
  });
  const g0 = md[0].g, g1 = md[md.length - 1].g;
  const gr = G_MONTHS[g0.getMonth()] + (g0.getMonth() !== g1.getMonth() ? ' — ' + G_MONTHS[g1.getMonth()] : '') + ' ' + ar(g1.getFullYear()) + 'م';
  return `<div class="page ${dir}"><div class="vhead"><div><h2>${H_MONTHS[m - 1]} ${ar(YEAR)}هـ</h2><p>${gr} · ${ar(md.length)} يومًا</p></div></div>
    <div class="mgrid">${g}</div>
    <div class="legend"><span><i></i> مناسبة أو حدث</span><span>الأيام الباهتة لم يحن وقتها 🔒</span></div>
    ${evs.length ? `<section class="card mevents"><div class="lbl"><span class="dot"></span>مناسبات هذا الشهر</div><ul class="list-ev">${evs.join('')}</ul></section>` : ''}
  </div>`;
}

/* ---------------- العرض والتنقل ---------------- */
function render(){
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  if (view === 'day') stage.innerHTML = cur > TODAY ? lockHTML(cur) : dayHTML(cur);
  else if (view === 'week') stage.innerHTML = weekHTML();
  else stage.innerHTML = monthHTML();
  dir = '';
  wire();
  navState();
  $('#foot').textContent = 'التاريخ الهجري وفق تقويم أم القرى' + (S.adj ? ' (مع تعديل ' + (S.adj > 0 ? '+' : '') + ar(S.adj) + ' يوم)' : '') + (intlFmt ? '' : ' — حساب تقريبي');
}
function navState(){
  const P = $('#prevBtn'), N = $('#nextBtn'), T = $('#todayBtn');
  let canP, canN, pt, nt, ps = '', ns = '';
  if (view === 'day'){
    canP = cur > 0; canN = cur <= TODAY && cur < DAYS.length - 1;
    pt = cur === TODAY ? 'أمس' : cur === TODAY + 1 ? 'اليوم' : 'السابق';
    nt = cur === TODAY ? 'غدًا' : cur === TODAY - 1 ? 'اليوم' : 'التالي';
    if (canP) ps = ar(DAYS[cur - 1].d) + ' ' + H_MONTHS[DAYS[cur - 1].m - 1];
    if (canN) ns = cur === TODAY ? 'لم يحن بعد 🔒' : ar(DAYS[cur + 1].d) + ' ' + H_MONTHS[DAYS[cur + 1].m - 1];
    T.hidden = cur === TODAY;
  } else if (view === 'week'){
    const s = weekStart(cur); canP = s > 0; canN = s + 7 < DAYS.length;
    pt = 'الأسبوع السابق'; nt = 'الأسبوع التالي';
    T.hidden = s <= TODAY && TODAY < s + 7;
  } else {
    const m = DAYS[cur].m; canP = m > DAYS[0].m; canN = m < DAYS[DAYS.length - 1].m;
    pt = 'الشهر السابق'; nt = 'الشهر التالي';
    if (canP) ps = H_MONTHS[m - 2]; if (canN) ns = H_MONTHS[m];
    T.hidden = m === DAYS[TODAY].m;
  }
  P.disabled = !canP; N.disabled = !canN;
  $('#prevTx').textContent = pt; $('#nextTx').textContent = nt;
  $('#prevSub').textContent = ps; $('#nextSub').textContent = ns;
}
function go(step){
  if (view === 'day'){
    const n = cur + step;
    if (n < 0 || n >= DAYS.length || (step > 0 && cur > TODAY)) return;
    cur = n;
  } else if (view === 'week'){
    const s = weekStart(cur) + step * 7;
    if (s + 6 < 0 || s >= DAYS.length) return;
    cur = Math.min(DAYS.length - 1, Math.max(0, s + 3));
    if (s <= TODAY && TODAY < s + 7) cur = TODAY;
  } else {
    const m = DAYS[cur].m + step, f = DAYS.find(d => d.m === m);
    if (!f) return;
    cur = DAYS[TODAY].m === m ? TODAY : (f.i > TODAY ? f.i : Math.min(TODAY, DAYS.filter(d => d.m === m).pop().i));
  }
  dir = step > 0 ? 'in-next' : 'in-prev';
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function goToday(){ dir = cur > TODAY ? 'in-prev' : 'in-next'; cur = TODAY; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function setView(v){ view = v; S.view = v; saveS(); if (v === 'day' && cur > TODAY) cur = TODAY; dir = ''; render(); }

function speak(t){
  try{ const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function wire(){
  stage.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { cur = +b.dataset.go; view = 'day'; S.view = 'day'; saveS(); dir = 'in-next'; render(); window.scrollTo({top:0}); }));
  stage.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say)));
  const bt = $('#backToday'); if (bt) bt.addEventListener('click', goToday);
  const st = $('#stToggle');
  const openStory = open => { $('#stTxt').classList.toggle('clamp', !open); $('#stLesson').hidden = !open; st.textContent = open ? 'إخفاء ↑' : 'أكمل القصة ←'; };
  if (st) st.addEventListener('click', () => openStory($('#stTxt').classList.contains('clamp')));
  const mb = $('#moreBtn');
  if (mb) mb.addEventListener('click', () => {
    const m = $('#more'), open = !m.classList.contains('open');
    m.classList.toggle('open', open); mb.textContent = open ? 'إخفاء المزيد ⌃' : 'المزيد لهذا اليوم ⌄';
    openStory(open);
    store.set('rz-more', open);
  });
  if (mb && store.get('rz-more', false)) mb.click();
  const note = $('#note');
  if (note){
    const k = 'rz-note-' + DAYS[cur].k; let t;
    note.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { store.set(k, note.value); $('#saved').textContent = '✓ حُفظت'; }, 400); });
  }
  const cb = $('#chBox');
  if (cb) cb.addEventListener('change', () => store.set('rz-ch-' + DAYS[cur].k, cb.checked));
}

/* ---------------- الأحداث العامة ---------------- */
$('#prevBtn').addEventListener('click', () => go(-1));
$('#nextBtn').addEventListener('click', () => go(1));
$('#todayBtn').addEventListener('click', goToday);
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || $('#modal').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') go(1);          // في الواجهة العربية: اليسار = التالي
  else if (e.key === 'ArrowRight') go(-1);
  else if (e.key === 'Home' || e.key === 't') goToday();
});
let tx = 0, ty = 0, tt = 0;
stage.addEventListener('touchstart', e => { const p = e.changedTouches[0]; tx = p.clientX; ty = p.clientY; tt = Date.now(); }, {passive: true});
stage.addEventListener('touchend', e => {
  if (e.target.closest('textarea')) return;
  const p = e.changedTouches[0], dx = p.clientX - tx, dy = p.clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dy) < Math.abs(dx) * 0.6 && Date.now() - tt < 800) go(dx > 0 ? 1 : -1);
}, {passive: true});

const modal = $('#modal');
$('#setBtn').addEventListener('click', () => { modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false'); });
const closeM = () => { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); };
$('#closeSet').addEventListener('click', closeM);
modal.addEventListener('click', e => { if (e.target === modal) closeM(); });
function changeAdj(n){
  S.adj = Math.max(-2, Math.min(2, S.adj + n)); saveS(); applyLook();
  const wasToday = cur === TODAY, k = DAYS[cur] && DAYS[cur].k;
  build();
  const f = DAYS.findIndex(d => d.k === k);
  cur = wasToday || f < 0 ? TODAY : f;
  render();
}
$('#adjMinus').addEventListener('click', () => changeAdj(-1));
$('#adjPlus').addEventListener('click', () => changeAdj(1));
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { S.theme = b.dataset.themeSet; saveS(); applyLook(); }));
document.querySelectorAll('[data-fs]').forEach(b => b.addEventListener('click', () => { S.fs = b.dataset.fs; saveS(); applyLook(); }));

/* عند منتصف الليل: تنتقل الروزنامة تلقائيًا إلى اليوم الجديد */
let lastKey = key(new Date());
setInterval(() => {
  const k = key(new Date());
  if (k !== lastKey){
    lastKey = k; const wasToday = cur === TODAY || cur === TODAY + 1;
    build(); if (wasToday) cur = TODAY; render();
  } else if (view === 'day' && cur === TODAY + 1) render();
}, 60000);

/* ---------------- البدء ---------------- */
applyLook();
build();
cur = TODAY;
render();
})();
</script>
</body>
</html>
