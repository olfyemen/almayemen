<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حقيبة الما · غرفة</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--line:#e7eaf3;--text:#1e2240;--muted:#7a809e;--accent:#6c5ce7;--mine:#ece8ff;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#111325;--panel:#1a1d33;--line:#2a2e4a;--text:#e8eaf6;--muted:#9aa0c0;--accent:#a99cff;--mine:#3a3170}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;flex:1}
header small{color:var(--muted);font-size:12px;display:block;font-weight:normal}
main{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px;margin:24px auto;width:100%}
.card h2{font-size:20px;margin-bottom:12px}
input[type=text],input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--text);margin-bottom:10px}
button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.5}
.err{color:var(--bad);margin:6px 0}
.sys{text-align:center;color:var(--muted);font-size:12px}
.row{display:flex}
.row.me{justify-content:flex-start}.row.other{justify-content:flex-end}
.bubble{max-width:min(78%,420px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 12px;word-wrap:break-word;white-space:pre-wrap}
.me .bubble{background:var(--mine);border-color:transparent}
.from{font-size:12px;font-weight:bold;color:var(--accent)}
.time{font-size:11px;color:var(--muted)}
.file{display:flex;gap:8px;align-items:center}
.file .ic{font-size:26px}
.file a{font-size:13px;color:var(--accent)}
footer{background:var(--panel);border-top:1px solid var(--line);padding:8px;display:flex;gap:6px;align-items:flex-end}
footer textarea{flex:1;resize:none;padding:10px;border:1px solid var(--line);border-radius:18px;font:inherit;background:var(--bg);color:var(--text);max-height:120px}
.attach{position:relative}
.menu{position:absolute;bottom:48px;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.menu.open{display:block}
.menu label{display:block;padding:12px;cursor:pointer}
.menu label:hover{background:var(--bg)}
.menu input{display:none}
#prog{display:none;padding:6px 16px;background:var(--panel);font-size:12px}
#prog .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
#prog .bar div{height:100%;background:var(--accent);width:0}
.banner{background:#fde8e8;color:#991b1b;padding:8px 16px;font-size:13px;display:none}
.credit{text-align:center;color:var(--muted);font-size:11px;margin-top:14px;line-height:1.7}
.rooms button{width:100%;margin-bottom:8px;text-align:right}
</style>
</head>
<body>
<header>
  <span style="font-size:26px">🧰</span>
  <h1 id="title">حقيبة الما<small id="sub">غرف الدردشة ونقل الملفات</small></h1>
  <button class="ghost" id="leaveBtn" style="display:none;padding:7px 12px">خروج</button>
</header>
<div class="banner" id="banner"></div>
<div id="prog"><span id="progTxt"></span><div class="bar"><div id="progBar"></div></div></div>
<main id="main"></main>
<footer id="composer" style="display:none">
  <div class="attach">
    <button id="attachBtn" title="إرفاق" style="padding:10px 14px">＋</button>
    <div class="menu" id="menu">
      <label>📄 ملفات<input type="file" id="files" multiple></label>
      <label>📁 مجلد كامل<input type="file" id="folder" webkitdirectory directory multiple></label>
    </div>
  </div>
  <textarea id="text" rows="1" placeholder="اكتب رسالة"></textarea>
  <button id="sendBtn">إرسال</button>
</footer>
<script>
const $ = s => document.querySelector(s);
const main = $('#main');
const params = new URLSearchParams(location.search);
let roomId = params.get('r') || '';
let roomName = '';
let token = sessionStorage.getItem('alma-token-' + roomId) || '';
let since = 0, polling = false;
const clientId = localStorage.getItem('alma-client') || (() => { const v = 'web-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('alma-client', v); return v; })();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const size = b => b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b >= 1024 ? Math.round(b / 1024) + ' KB' : b + ' B';
const time = t => new Date(t).toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' });
const credit = '<div class="credit">حقيبة الما 🧰 · تصميم م/ماهر العلفي<br>«نبدأ من حيث انتهى الآخرون - يد ويد»</div>';
const api = (p) => `/api/room/${roomId}/${p}${p.includes('?') ? '&' : '?'}t=${encodeURIComponent(token)}`;

async function jget(u) { const r = await fetch(u, { cache: 'no-store' }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || ('خطأ ' + r.status)), { status: r.status }); return j; }
async function jpost(u, body) { const r = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || ('خطأ ' + r.status)), { status: r.status }); return j; }

async function start() {
  let info;
  try { info = await jget('/api/info'); } catch (e) { main.innerHTML = '<div class="card"><h2>تعذر الاتصال</h2><p>تأكد أنك على نفس شبكة الهاتف.</p></div>' + credit; return; }
  $('#sub').textContent = 'على ' + info.n;
  const rooms = info.r || [];
  if (!roomId && rooms.length === 1) roomId = rooms[0].id;
  const room = rooms.find(r => r.id === roomId);
  if (!room) {
    main.innerHTML = `<div class="card rooms"><h2>الغرف المتاحة</h2>${rooms.length ? rooms.map(r => `<button class="ghost" data-id="${esc(r.id)}">${r.l ? '🔒' : '💬'} ${esc(r.n)} · ${r.m} متصل</button>`).join('') : '<p>لا توجد غرفة مفتوحة على هذا الهاتف الآن. اطلب من صاحبه إنشاء غرفة في «نقل الملفات».</p>'}</div>` + credit;
    main.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => { roomId = b.dataset.id; history.replaceState(null, '', '?r=' + roomId); start(); });
    return;
  }
  roomName = room.n; $('#title').firstChild.textContent = '💬 ' + room.n;
  if (token) return enter();
  showJoin(room);
}

function showJoin(room, msg) {
  main.innerHTML = `<div class="card"><h2>${room.l ? '🔒 ' : ''}${esc(room.n)}</h2>
    <input type="text" id="name" placeholder="اسمك" value="${esc(localStorage.getItem('alma-name') || '')}">
    ${room.l ? '<input type="password" id="pass" placeholder="كلمة السر">' : ''}
    <div class="err">${esc(msg || '')}</div>
    <button id="join" style="width:100%">دخول الغرفة</button></div>` + credit;
  $('#join').onclick = async () => {
    const name = $('#name').value.trim() || 'ضيف';
    localStorage.setItem('alma-name', name);
    try {
      const r = await jpost(`/api/room/${roomId}/join`, { name, pass: $('#pass')?.value || '', clientId });
      token = r.token; sessionStorage.setItem('alma-token-' + roomId, token); enter();
    } catch (e) { showJoin(room, e.message); }
  };
}

function enter() {
  main.innerHTML = ''; since = 0;
  $('#composer').style.display = 'flex'; $('#leaveBtn').style.display = 'inline-block';
  if (!polling) poll();
}

const groups = {};
function render(m) {
  if (m.kind === 'sys') { main.insertAdjacentHTML('beforeend', `<div class="sys">${esc(m.text)}</div>`); return; }
  const mine = m.fromId === clientId;
  let body;
  if (m.kind === 'file') {
    const folder = m.path.includes('/') ? m.path.slice(0, m.path.lastIndexOf('/')) : '';
    body = `<div class="file"><span class="ic">📄</span><div><div><bdi>${esc(m.name)}</bdi></div><div class="time"><span dir="ltr">${size(m.size)}</span>${folder ? ' · 📁 <bdi>' + esc(folder) + '</bdi>' : ''}</div>
      <a href="${api('file/' + m.fid)}" download="${esc(m.name)}">⬇ تنزيل</a></div></div>`;
    if (m.group && folder) {
      groups[m.group] = (groups[m.group] || 0) + 1;
      if (groups[m.group] === 2) main.insertAdjacentHTML('beforeend', `<div class="sys"><a class="btn ghost" style="padding:6px 12px" href="${api('zip/' + m.group)}">⬇ تنزيل المجلد «${esc(m.path.split('/')[0])}» كملف ZIP</a></div>`);
    }
  } else body = esc(m.text);
  main.insertAdjacentHTML('beforeend', `<div class="row ${mine ? 'me' : 'other'}"><div class="bubble">${mine ? '' : `<div class="from">${esc(m.from)}</div>`}${body}<div class="time">${time(m.time)}</div></div></div>`);
}

async function poll() {
  polling = true;
  while (token) {
    try {
      const ev = await jget(api('events?since=' + since));
      $('#banner').style.display = 'none';
      const atBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
      ev.events.forEach(render); since = ev.next;
      $('#sub').textContent = '👥 ' + ev.members.length + ' متصل: ' + ev.members.join('، ');
      $('#attachBtn').disabled = ev.allowFiles === false;
      $('#attachBtn').title = ev.allowFiles === false ? 'أوقف صاحب الغرفة إرسال الملفات' : 'إرفاق';
      if (ev.events.length && atBottom) main.scrollTop = main.scrollHeight;
      if (ev.closed) { banner('أُغلقت الغرفة من صاحبها'); token = ''; break; }
    } catch (e) {
      if (e.status === 401 || e.status === 404) { sessionStorage.removeItem('alma-token-' + roomId); token = ''; banner(e.message); setTimeout(start, 1500); break; }
      banner('انقطع الاتصال… يعيد المحاولة'); await new Promise(r => setTimeout(r, 2000));
    }
  }
  polling = false;
}
function banner(t) { const b = $('#banner'); b.textContent = t; b.style.display = 'block'; }

async function sendText() {
  const t = $('#text').value.trim(); if (!t) return;
  $('#text').value = '';
  try { await jpost(api('msg'), { text: t }); } catch (e) { banner(e.message); }
}
$('#sendBtn').onclick = sendText;
$('#text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
$('#attachBtn').onclick = () => $('#menu').classList.toggle('open');
$('#leaveBtn').onclick = async () => { try { await jpost(api('leave'), {}); } catch (e) {} sessionStorage.removeItem('alma-token-' + roomId); token = ''; location.reload(); };

function upload(file, path, group, onp) {
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open('POST', api(`upload?group=${group}&path=${encodeURIComponent(path)}`));
    x.upload.onprogress = e => onp(e.loaded);
    x.onload = () => x.status < 400 ? ok() : fail(new Error((JSON.parse(x.responseText || '{}').error) || 'فشل الرفع'));
    x.onerror = () => fail(new Error('انقطع الاتصال'));
    x.send(file);
  });
}
async function sendFiles(list) {
  $('#menu').classList.remove('open');
  const files = [...list]; if (!files.length) return;
  const total = files.reduce((a, f) => a + f.size, 0); let done = 0;
  const group = Math.random().toString(36).slice(2, 10);
  $('#prog').style.display = 'block';
  try {
    for (const f of files) {
      $('#progTxt').textContent = '⬆ ' + (f.webkitRelativePath || f.name);
      await upload(f, f.webkitRelativePath || f.name, group, l => { $('#progBar').style.width = ((done + l) / total * 100) + '%'; });
      done += f.size;
    }
  } catch (e) { banner(e.message); }
  $('#prog').style.display = 'none'; $('#files').value = ''; $('#folder').value = '';
}
$('#files').onchange = e => sendFiles(e.target.files);
$('#folder').onchange = e => sendFiles(e.target.files);
start();
</script>
</body>
</html>
